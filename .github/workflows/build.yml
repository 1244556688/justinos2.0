name: Build JustinOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix APT sources and install dependencies
        run: |
          # 修正 Ubuntu 環境本身的 Debian 12 來源衝突（選擇性，預防萬一）
          sudo sed -i 's|bookworm/updates|bookworm-security|g' /etc/apt/sources.list || true
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap curl

      - name: Configure Live-Build
        run: |
          # 關鍵修正：對於 Debian 12 (bookworm)，必須指定正確的 security 鏡像路徑
          # 我們將 --parent-mirror-binary-security 指向正確的 debian-security 位址
          sudo env -i PATH="$PATH" lb config \
            --mode debian \
            --distribution bookworm \
            --parent-mirror-bootstrap "http://debian.org" \
            --parent-mirror-binary-security "http://debian.org" \
            --mirror-binary-security "http://debian.org" \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer false \
            --bootappend-live "boot=live components quiet" \
            --archive-areas "main contrib non-free non-free-firmware"

      - name: Build ISO
        run: |
          # 執行編譯，使用 env -i 確保環境乾淨
          # 如果 build 失敗，lb 會留下半成品，這會導致重試失敗，所以通常在 clean 環境執行
          sudo env -i PATH="$PATH" lb build

      - name: Check for ISO file
        run: |
          echo "Listing generated files:"
          ls -lh *.iso || echo "No ISO file found"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustinOS-Live-ISO
          path: "*.iso"
          if-no-files-found: error
