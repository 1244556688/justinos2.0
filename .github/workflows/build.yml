name: Build JustinOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap curl

      - name: Configure Live-Build
        run: |
          # 使用 env -i 清理 GitHub 變數，並修正 Bookworm 的 security 路徑
          sudo env -i PATH="$PATH" lb config \
            --mode debian \
            --distribution bookworm \
            --parent-mirror-binary-security "http://debian.org" \
            --mirror-binary-security "http://debian.org" \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer false \
            --bootappend-live "boot=live components quiet" \
            --archive-areas "main contrib non-free non-free-firmware"

      - name: Build ISO
        run: |
          # 執行編譯，同樣維持乾淨環境
          sudo env -i PATH="$PATH" lb build

      - name: Check for ISO file
        run: |
          echo "Listing generated files:"
          ls -lh *.iso || echo "No ISO file found"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustinOS-Live-ISO
          path: "*.iso"
          if-no-files-found: error
